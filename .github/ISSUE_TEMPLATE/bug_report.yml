name: "🐛 Bug Report"
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill in as much detail as you can.

  - type: input
    id: summary
    attributes:
      label: What happened?
      description: A clear, one-line summary of the bug.
      placeholder: "e.g. CSV export is missing the Healthcare column"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How do we trigger the bug?
      placeholder: |
        1. Enable Healthcare modeling
        2. Click Table tab → Export CSV
        3. Open the file — Healthcare column is missing
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: "Healthcare column should appear in the exported CSV"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      placeholder: "Column is absent; data is shifted left by one"
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser & OS
      placeholder: "e.g. Chrome 124 on macOS 14"
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low — cosmetic or minor inconvenience
        - Medium — feature broken but workaround exists
        - High — data loss or core feature unusable
        - Critical — app crashes or security concern
    validations:
      required: true
