name: "💡 Feedback / Feature Request"
description: Share an idea or suggest an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We love hearing how to make RetireEase better. Tell us what you have in mind!

  - type: input
    id: summary
    attributes:
      label: What would you like to see?
      description: A short title for your idea.
      placeholder: "e.g. Add inflation-adjusted spending slider"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the gap or friction you're experiencing today.
      placeholder: |
        Right now I have to manually adjust my withdrawal amount each time I want to
        model a different inflation assumption. A slider would make this much faster.
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed solution (optional)
      description: How do you imagine this working?
      placeholder: "A horizontal slider in the Inputs panel, range 0–10%, default 3%"
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Which area of the app is this about?
      options:
        - Dashboard / Charts
        - Inputs / Settings panel
        - Table view / Exports
        - PDF / Print reports
        - Scenario management
        - Onboarding
        - Mobile experience
        - Performance
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Would use it regularly
        - Blocking my use of the app
    validations:
      required: true
